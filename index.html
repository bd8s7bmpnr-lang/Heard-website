<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heard — APRS, made clear.</title>
    <meta name="description" content="Heard — Real-time APRS activity around you. Coming soon.">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --midnight: #0A0F1F;
            --electric-blue: #0A84FF;
            --deep-navy: #001633;
            --soft-gray: #8E9AAF;
            --white: #FFFFFF;
        }

        html {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--midnight);
            color: var(--white);
            min-height: 100vh;
            min-height: 100svh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        body {
            width: 100%;
            padding: 2rem;
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
            text-align: center;
            padding-bottom: max(3rem, env(safe-area-inset-bottom, 0px) + 3rem);
        }

        /* Earth horizon artwork */
        .horizon {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 45vh;
            min-height: 150px;
            max-height: 320px;
            background: url('./Assets/heard-horizon.png') no-repeat center bottom / 100% auto;
            mask-image: linear-gradient(to top, black 0%, black 50%, transparent 100%);
            -webkit-mask-image: linear-gradient(to top, black 0%, black 50%, transparent 100%);
            pointer-events: none;
            z-index: -1;
        }

        /* App icon */
        .icon {
            width: 100px;
            height: 100px;
            margin: 0 auto 1.6rem;
            border-radius: 22px;
        }

        @media (min-width: 375px) {
            .icon {
                width: 110px;
                height: 110px;
            }
        }

        /* Brand name */
        .logo {
            font-size: 2.6rem;
            font-weight: 700;
            margin-bottom: 0.2rem;
        }

        .tagline {
            font-size: 1rem;
            font-weight: 400;
            color: var(--electric-blue);
            letter-spacing: 0.03em;
            margin-bottom: 1.4rem;
        }

        h2 {
            font-size: 1.15rem;
            font-weight: 400;
            color: #9EAABF;
            line-height: 1.7;
            margin-bottom: 1.8rem;
        }

        .coming-soon {
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--electric-blue);
            margin-bottom: 2rem;
        }

        /* Footer */
        .footer {
            font-size: 0.8rem;
            color: #8E9AAF;
            opacity: 0.4;
            margin-top: 1.5rem;
        }

        /* Responsive */
        @media (max-width: 540px) {
            .logo { font-size: 2rem; }
            h2 { font-size: 1rem; }
        }

        /* Reduced motion */
        @media (prefers-reduced-motion: reduce) {
            .horizon {
                opacity: 0.04;
            }
        }
    </style>
</head>
<body>
    <div class="horizon"></div>

    <div class="container">
        <img
            src="./Assets/app-icon.png"
            alt="Heard"
            class="icon"
            width="100"
            height="100"
        >

        <p class="logo">Heard</p>
        <p class="tagline">APRS, made clear.</p>

        <h2>Real-time APRS activity around you.<br>Know what's happening. Stay connected.</h2>

        <p class="coming-soon">Coming Soon</p>

        <p class="footer">Built with care for the amateur radio community.</p>
    </div>
</body>
</html>
